[package]
name = "codex-ai-ip-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "codex_ai_ip_eval"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "codex-ai-ip-eval"
path = "src/main.rs"

[[bin]]
name = "ai-ip-native-app-server-fixture"
path = "src/bin/ai_ip_native_app_server_fixture/main.rs"
test = false
bench = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
codex-ai-ip-domain = { workspace = true }
codex-ai-ip-runtime = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-process-hardening = { workspace = true }
codex-protocol = { workspace = true }
codex-responses-api-proxy = { workspace = true }
codex-skills = { workspace = true }
ctor = { workspace = true }
hmac = { workspace = true }
jsonschema = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt-multi-thread", "sync", "time"] }
toml = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
codex-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tiny_http = { workspace = true }
